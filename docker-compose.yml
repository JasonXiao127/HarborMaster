services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.4.1
    container_name: docker_socket_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Read-only sections the UI needs
      - CONTAINERS=1
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - EXEC=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - INFO=0
      - SYSTEM=0
      - POST=1
      # Fine-grained POST allowlist (proxy still permits any
      # /containers POST via CONTAINERS=1, so treat this as
      # defense-in-depth, not a full sandbox — see README)
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - ALLOW_PAUSE=0
      - ALLOW_UNPAUSE=0
      - LOG_LEVEL=info
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    networks:
      - monitor-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2375/_ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  monitor:
    build: .
    image: harbormaster-monitor:latest
    container_name: docker_resource_monitor
    user: "65532:65532"
    ports:
      # Must stay IP:PORT (e.g. 127.0.0.1:5000). A bare "5000" publishes on all interfaces.
      - "${APP_HOST_PORT:-127.0.0.1:5000}:5000"
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      - APP_PORT=5000
      - DOCKER_TIMEOUT=${DOCKER_TIMEOUT:-5}
      - STATS_TIMEOUT=${STATS_TIMEOUT:-5}
      - MONITOR_AUTH_TOKEN=${MONITOR_AUTH_TOKEN:-}
    depends_on:
      socket-proxy:
        condition: service_healthy
    networks:
      - monitor-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

networks:
  monitor-net:
    driver: bridge
